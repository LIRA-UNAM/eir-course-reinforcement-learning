[project]
name = "eir-course"
version = "0.1.0"
description = "EIR course on reinforcement learning: from a Q-learning Furuta pendulum to K1 humanoid locomotion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab[cu128]",
    "mujoco==3.11.0",
    "torch>=2.7.0,<2.10.0",
    "numpy",
    "pyyaml",
    "tqdm",
    "tyro>=1.0.1",
    "wandb>=0.22.3",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", tag = "v1.6.0" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", tag = "v3.11.0" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# MuJoCo comes from PyPI: the 3.11.0 release matches mujoco-warp v3.11.0 and
# mjlab 1.6.0 (mujoco<3.12). The nightly index no longer carries 3.11 builds.

[tool.ruff]
indent-width = 2
src = ["src/eir_course"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.13"
ignore = ["./typings"]
stubPath = "typings"
reportWildcardImportFromLibrary = false

[tool.pytest.ini_options]
markers = ["slow: builds simulation environments"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "eir_course.scripts.play:main"
list_envs = "mjlab.scripts.list_envs:main"
train_queue = "eir_course.scripts.train_queue:main"

[project.entry-points."mjlab.tasks"]
eir_course = "eir_course"
