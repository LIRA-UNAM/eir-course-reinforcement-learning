# All K1 velocity examples (example3-example10), trained back to back.
# The Furuta examples have their own queue: queues/furuta.train.yaml
# Run with: uv run train_queue queues/course.train.yaml

defaults:
  num_envs: 4096
  extra_args: []

stop_on_failure: false

tasks:
  - task: example3
  - task: example4
  - task: example5
  - task: example6
  - task: example7
  - task: example8
  - task: example9
  - task: example10
