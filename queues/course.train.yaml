# Every course example (example1-example10), trained back to back.
# Run with: uv run train_queue queues/course.train.yaml

defaults:
  num_envs: 4096
  extra_args: []

stop_on_failure: false

tasks:
  # Furuta pendulum, tabular Q-learning. 256 envs: the iteration budgets of
  # these examples are sized for 256 envs x 24 steps per iteration.
  - task: example1
    num_envs: 256
  - task: example2
    num_envs: 256
  # Booster K1 velocity, PPO.
  - task: example3
  - task: example4
  - task: example5
  - task: example6
  - task: example7
  - task: example8
  - task: example9
  - task: example10
